<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beheer · Ruby Pearl</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF7F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruby Pearl">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>
/* Ruby Pearl – gedeelde code voor de boekingspagina en de beheerpagina. */
(function () {
  'use strict';
  var C = window.RP_CONFIG || {};
  var DEMO = !!C.DEMO;
  var API = String(C.API_URL || '').trim();
  // De link naar Google staat in koppeling.txt, naast deze pagina.
  var apiKlaar = null;
  function apiUrl() {
    if (API) return Promise.resolve(API);
    if (!apiKlaar) {
      apiKlaar = fetch('koppeling.txt', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (t) { var m = /https?:\/\/[^\s'"<>]+/.exec(t); API = m ? m[0] : ''; return API; })
        .catch(function () { return ''; });
    }
    return apiKlaar;
  }

  var NAMEN = {
    nl: { dagen: ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'], kort: 2,
          maanden: ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'], uur: 'uur' },
    en: { dagen: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], kort: 3,
          maanden: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'], uur: 'hr' }
  };
  var TAAL = 'nl';
  function setTaal(t) { TAAL = t === 'en' ? 'en' : 'nl'; }
  function taal() { return TAAL; }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function naarMin(t) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(t == null ? '' : t).trim());
    return m ? (+m[1]) * 60 + (+m[2]) : NaN;
  }
  function naarTijd(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function utc(k) { var p = k.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function plusDagen(k, n) { var d = new Date(utc(k) + n * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function dagVerschil(a, b) { return Math.round((utc(b) - utc(a)) / 864e5); }
  function dagNr(k) { return new Date(utc(k)).getUTCDay(); }
  function dagNaam(k) { return NAMEN[TAAL].dagen[dagNr(k)]; }
  function dagKort(k) { return NAMEN[TAAL].dagen[dagNr(k)].slice(0, NAMEN[TAAL].kort); }
  function dagGetal(k) { return new Date(utc(k)).getUTCDate(); }
  function maandNaam(k) { return NAMEN[TAAL].maanden[new Date(utc(k)).getUTCMonth()]; }
  function maandKort(k) { return maandNaam(k).slice(0, 3); }
  function datumLang(k) { return dagNaam(k) + ' ' + dagGetal(k) + ' ' + maandNaam(k); }
  function datumKort(k) { return dagKort(k) + ' ' + dagGetal(k) + ' ' + maandKort(k); }
  function maandag(k) { return plusDagen(k, -((dagNr(k) + 6) % 7)); }
  function weekNr(k) {
    var d = new Date(utc(k)); var dag = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - dag + 3);
    var eersteDo = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    return 1 + Math.round(((d - eersteDo) / 864e5 - 3 + ((eersteDo.getUTCDay() + 6) % 7)) / 7);
  }

  function duurTekst(m) {
    m = +m || 0;
    var h = Math.floor(m / 60), r = m % 60;
    var u = NAMEN[TAAL].uur;
    if (h && r) return h + ' ' + u + ' ' + r + ' min';
    if (h) return h + ' ' + u;
    return r + ' min';
  }
  function prijsGetal(p) {
    var s = String(p == null ? '' : p).replace(/€/g, '').replace(/\s/g, '').replace(',', '.');
    return /^\d+(\.\d{1,2})?$/.test(s) ? parseFloat(s) : NaN;
  }
  function euro(g) { return '€' + (g % 1 ? g.toFixed(2).replace('.', ',') : String(g)); }
  function prijsTekst(p) {
    var s = String(p == null ? '' : p).trim();
    if (!s) return '';
    var g = prijsGetal(s);
    return isNaN(g) ? s : euro(g);
  }
  // Zelfde regel als in de backend: alleen een totaal als alles een getal is.
  function totaalPrijs(items) {
    if (!items.length || !String(items[0].prijs || '').trim()) return '';
    var som = 0;
    for (var i = 0; i < items.length; i++) {
      var p = String(items[i].prijs || '').trim();
      if (!p) continue;
      var g = prijsGetal(p);
      if (isNaN(g)) return '';
      som += g;
    }
    return euro(som);
  }

  function samenvoegen(blokken) {
    var s = blokken.slice().sort(function (a, b) { return a[0] - b[0]; }), uit = [];
    s.forEach(function (b) { var l = uit[uit.length - 1]; if (l && b[0] <= l[1]) l[1] = Math.max(l[1], b[1]); else uit.push([b[0], b[1]]); });
    return uit;
  }
  // Zelfde rekenregel als vrijeTijden_ in Code.gs.
  function vrijeTijden(dag, duur, r, dagIndex, nuMin) {
    var uit = [];
    if (!dag) return uit;
    var stap = Math.max(5, r.stap || 30), pauze = r.pauze || 0, minV = r.minVooruit || 0;
    dag.open.forEach(function (blok) {
      for (var m = blok[0]; m + duur <= blok[1]; m += stap) {
        if (dagIndex * 1440 + m - nuMin < minV) continue;
        var botst = dag.bezet.some(function (b) { return m < b[1] + pauze && m + duur + pauze > b[0]; });
        if (!botst && uit.indexOf(m) < 0) uit.push(m);
      }
    });
    return uit.sort(function (a, b) { return a - b; });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function waNummer(t) {
    var d = String(t || '').replace(/[^\d+]/g, '');
    if (d.indexOf('+') === 0) d = d.slice(1);
    else if (d.indexOf('00') === 0) d = d.slice(2);
    else if (d.indexOf('0') === 0) d = '31' + d.slice(1);
    return d.replace(/\D/g, '');
  }
  function waLink(nummer, tekst) { return 'https://wa.me/' + waNummer(nummer) + (tekst ? '?text=' + encodeURIComponent(tekst) : ''); }
  function telLink(nummer) { return 'tel:' + String(nummer || '').replace(/[^\d+]/g, ''); }

  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* geen opslag */ } }

  function wacht(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function laadScript(src) {
    return new Promise(function (ok, nee) {
      var s = document.createElement('script');
      s.src = src; s.onload = ok; s.onerror = function () { nee(new Error('Demo kon niet laden.')); };
      document.head.appendChild(s);
    });
  }
  var demoKlaar = null;
  function laadDemo() {
    if (!demoKlaar) demoKlaar = laadScript('demo/stubs.js').then(function () { return laadScript('demo/backend.js'); }).then(function () { return laadScript('demo/seed.js'); });
    return demoKlaar;
  }

  function controleer(j) {
    if (!j || !j.ok) {
      var e = new Error((j && j.fout) || 'Er ging iets mis. Probeer het opnieuw.');
      e.login = !!(j && j.login);
      throw e;
    }
    return j;
  }

  function api(action, data) {
    var body = Object.assign({ action: action }, data || {});
    if (DEMO) {
      return laadDemo().then(function () { return wacht(action === 'info' ? 350 : 450); }).then(function () {
        return controleer(JSON.parse(window.doPost({ postData: { contents: JSON.stringify(body) } }).getContent()));
      });
    }
    return apiUrl().then(function (url) {
      if (!url) throw new Error('De website is nog niet gekoppeld aan Google. Zet je link in koppeling.txt.');
      var verzoek = action === 'info'
        ? fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 'action=info', { cache: 'no-store' })
        : fetch(url, { method: 'POST', body: JSON.stringify(body) });
      return verzoek.then(function (res) {
        return res.json().catch(function () { throw new Error('De agenda reageert niet goed. Probeer het later opnieuw.'); });
      }, function () {
        throw new Error('Geen verbinding. Check je internet en probeer het opnieuw.');
      });
    }).then(controleer);
  }

  window.RP = {
    DEMO: DEMO, api: api, setTaal: setTaal, taal: taal, pad: pad, naarMin: naarMin, naarTijd: naarTijd, plusDagen: plusDagen, dagVerschil: dagVerschil,
    dagNaam: dagNaam, dagKort: dagKort, dagGetal: dagGetal, maandNaam: maandNaam, maandKort: maandKort,
    datumLang: datumLang, datumKort: datumKort, maandag: maandag, weekNr: weekNr,
    duurTekst: duurTekst, prijsGetal: prijsGetal, prijsTekst: prijsTekst, totaalPrijs: totaalPrijs, euro: euro,
    samenvoegen: samenvoegen, vrijeTijden: vrijeTijden, esc: esc, waNummer: waNummer, waLink: waLink, telLink: telLink,
    lsGet: lsGet, lsSet: lsSet
  };
})();
</script>
</head>
<body>

<div class="demo-bar" id="demo-bar" hidden>
  <div class="in">
    <b>Voorbeeld</b>
    <span>Beheer in de demo. Wachtwoord: <strong>nagels</strong></span>
    <a href="index.html">Naar de boekingspagina</a>
    <button type="button" id="demo-reset">Demo opnieuw beginnen</button>
  </div>
</div>

<div class="login" id="login" hidden>
  <form id="login-form" novalidate>
    <img src="logo.png" alt="Ruby Pearl" width="96" height="96">
    <h1>Beheer</h1>
    <p>Log in om je afspraken en werktijden te beheren.</p>
    <div class="field">
      <label for="ww">Wachtwoord</label>
      <input id="ww" type="password" autocomplete="current-password" required>
    </div>
    <p class="alert alert-err" id="login-fout" role="alert" hidden></p>
    <button class="btn btn-block" type="submit" id="login-knop">Inloggen</button>
  </form>
</div>

<div class="adm" id="app" hidden>
  <header class="adm-top">
    <div class="in">
      <img src="logo.png" alt="" width="38" height="38">
      <h1 id="titel">Afspraken</h1>
      <button class="icon-btn" type="button" id="ververs" aria-label="Vernieuwen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>
  <main class="adm-main" id="main"></main>
  <div class="savebar" id="savebar" hidden>
    <div class="in"><span>Niet opgeslagen</span><span style="display:flex;gap:6px"><button class="btn" type="button" id="ongedaan" style="background:transparent;color:#fff">Ongedaan</button><button class="btn" type="button" id="opslaan">Opslaan</button></span></div>
  </div>
  <nav class="tabs" aria-label="Menu">
    <div class="in">
      <a href="#afspraken" data-tab="afspraken"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M7.5 14h3M7.5 17.5h6"/></svg>Afspraken<span class="count" id="nieuw-count" hidden></span></a>
      <a href="#werktijden" data-tab="werktijden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Werktijden</a>
      <a href="#behandelingen" data-tab="behandelingen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 10h6l1 10H8l1-10z"/><path d="M10 10V6a2 2 0 0 1 4 0v4"/></svg>Behandelingen</a>
      <a href="#instellingen" data-tab="instellingen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Instellingen</a>
    </div>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var R = window.RP;
  var $ = function (s) { return document.querySelector(s); };
  var IC = {
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19.1L4 20z"/></svg>',
    bel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    links: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    rechts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    neer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
  };
  var TITELS = { afspraken: 'Afspraken', werktijden: 'Werktijden', behandelingen: 'Behandelingen', instellingen: 'Instellingen' };
  var S = {
    token: R.lsGet('rp_token'), data: null, tab: 'afspraken', week: 0, oud: false, addOpen: null, cancelOpen: null,
    draft: null, dirty: false, inst: null, instDirty: false, kopieerZeker: false, delZeker: null, open: {}, nieuwSinds: null, laatst: 0, bezig: false
  };

  if (R.DEMO) {
    $('#demo-bar').hidden = false;
    $('#demo-reset').addEventListener('click', function () {
      R.lsSet('rp_token', null); R.lsSet('rp_gezien', null);
      if (window.__RP_RESET) window.__RP_RESET();
      try { localStorage.removeItem('rp_demo_store_v9'); } catch (e) {}
      location.reload();
    });
  }

  /* ---------- algemeen ---------- */
  var toastTimer;
  function toast(tekst, isFout) {
    var t = $('#toast');
    t.textContent = tekst; t.className = 'toast on' + (isFout ? ' err' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = 'toast' + (isFout ? ' err' : ''); }, isFout ? 4200 : 2200);
  }
  function nuTekst() { return S.data.nu.datum + ' ' + R.naarTijd(S.data.nu.min); }
  function site() {
    if (!/^https?:$/.test(location.protocol)) return '';
    return location.origin + location.pathname.replace(/[^/]*$/, '');
  }
  function boekLink() { return (S.data && S.data.instellingen.website) || (R.DEMO ? '' : site()); }
  function fout(err) {
    if (err && err.login) { uitloggenLokaal(); toast('Log opnieuw in.', true); return; }
    toast((err && err.message) || 'Er ging iets mis.', true);
  }
  function api(action, data) { return R.api(action, Object.assign({ token: S.token }, data || {})); }
  function kopieer(tekst, el) {
    var klaar = function () { toast('Link gekopieerd'); };
    try {
      navigator.clipboard.writeText(tekst).then(klaar, function () { selecteer(el); });
    } catch (e) { selecteer(el); }
  }
  function selecteer(el) {
    if (!el) return;
    var r = document.createRange(); r.selectNodeContents(el);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    toast('Kopieer de link met Kopiëren');
  }

  /* ---------- inloggen ---------- */
  function toonLogin() { $('#app').hidden = true; $('#login').hidden = false; setTimeout(function () { $('#ww').focus(); }, 50); }
  function uitloggenLokaal() { S.token = null; S.data = null; R.lsSet('rp_token', null); toonLogin(); }
  $('#login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var knop = $('#login-knop'), f = $('#login-fout');
    if (!$('#ww').value) { f.textContent = 'Vul je wachtwoord in.'; f.hidden = false; return; }
    knop.disabled = true; knop.textContent = 'Even geduld…'; f.hidden = true;
    R.api('login', { wachtwoord: $('#ww').value }).then(function (r) {
      S.token = r.token; R.lsSet('rp_token', r.token); $('#ww').value = '';
      return laad();
    }).catch(function (err) { f.textContent = err.message; f.hidden = false; })
      .then(function () { knop.disabled = false; knop.textContent = 'Inloggen'; });
  });

  function laad() {
    var knop = $('#ververs'); knop.classList.add('spin');
    return api('beheer', { site: site() }).then(function (d) {
      S.data = d; S.laatst = Date.now();
      if (S.nieuwSinds === null) S.nieuwSinds = R.lsGet('rp_gezien') || (R.plusDagen(d.nu.datum, -1) + ' ' + R.naarTijd(d.nu.min));
      if (!S.dirty) S.draft = null;
      if (!S.instDirty) S.inst = null;
      $('#login').hidden = true; $('#app').hidden = false;
      route();
    }).catch(fout).then(function () { knop.classList.remove('spin'); });
  }
  $('#ververs').addEventListener('click', function () { laad(); });

  /* ---------- tabs ---------- */
  function route() {
    if (!S.data) return;
    var t = location.hash.replace('#', '');
    S.tab = TITELS[t] ? t : 'afspraken';
    document.querySelectorAll('.tabs a').forEach(function (a) {
      if (a.dataset.tab === S.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    $('#titel').textContent = TITELS[S.tab];
    ({ afspraken: renderAfspraken, werktijden: renderWerktijden, behandelingen: renderBehandelingen, instellingen: renderInstellingen })[S.tab]();
    renderSavebar(); renderTeller();
  }
  window.addEventListener('hashchange', function () { S.kopieerZeker = false; S.delZeker = null; route(); window.scrollTo(0, 0); });

  function renderTeller() {
    var gezien = R.lsGet('rp_gezien') || S.nieuwSinds;
    var n = S.data.afspraken.filter(function (a) { return a.status === 'bevestigd' && a.aangemaakt > gezien; }).length;
    var c = $('#nieuw-count');
    c.hidden = !n || S.tab === 'afspraken'; c.textContent = n;
  }

  /* ---------- afspraken ---------- */
  function isKomend(a) {
    var n = S.data.nu;
    return a.datum > n.datum || (a.datum === n.datum && R.naarMin(a.tijd) + a.duur > n.min);
  }
  function dagKop(k) {
    var n = S.data.nu.datum, v = R.dagVerschil(n, k);
    var naam = v === 0 ? 'Vandaag' : v === 1 ? 'Morgen' : v === -1 ? 'Gisteren' : R.dagNaam(k).charAt(0).toUpperCase() + R.dagNaam(k).slice(1);
    return '<p class="day-head"><b>' + naam + '</b>' + R.dagGetal(k) + ' ' + R.maandNaam(k) + '</p>';
  }
  function kaart(a) {
    var eind = R.naarTijd(R.naarMin(a.tijd) + a.duur), uit = a.status !== 'bevestigd', voornaam = a.naam.split(' ')[0];
    var badge = uit ? '<span class="badge grey">' + (a.status.indexOf('klant') >= 0 ? 'Geannuleerd door klant' : 'Geannuleerd') + '</span>'
      : (a.aangemaakt > S.nieuwSinds ? '<span class="badge">Nieuw</span>' : '');
    if (a.taal === 'en') badge += '<span class="badge grey">Engels</span>';
    var h = '<article class="appt' + (uit ? ' off' : '') + '"><div class="appt-time"><b>' + R.esc(a.tijd) + '</b><span>' + eind + '</span></div><div class="appt-main">' +
      '<h3>' + R.esc(a.behandeling) + (a.extras ? ' <small>+ ' + R.esc(a.extras) + '</small>' : '') + badge + '</h3>' +
      '<p><strong>' + R.esc(a.naam) + '</strong>' + (a.prijs ? ' · ' + R.esc(R.prijsTekst(a.prijs)) : '') + '</p>' +
      '<p>' + R.esc(a.telefoon) + ' · ' + R.esc(a.email) + '</p>' +
      (a.opmerking ? '<p class="note">' + R.esc(a.opmerking) + '</p>' : '');
    if (!uit && isKomend(a)) {
      h += '<div class="appt-actions">' +
        '<a class="act" href="' + R.waLink(a.telefoon, (a.taal === 'en' ? 'Hi ' : 'Hoi ') + voornaam + '! ') + '" target="_blank" rel="noopener">' + IC.chat + 'WhatsApp</a>' +

    if (t.id === 'toon-oud') { S.oud = t.checked; return renderAfspraken(); }
    if (ds.annuleer) { S.cancelOpen = ds.annuleer; renderAfspraken(); var ta = $('#ann-bericht'); if (ta) ta.focus(); return; }
    if (ds.terug) { S.cancelOpen = null; return renderAfspraken(); }
    if (ds.bevestig) {
      t.disabled = true; t.textContent = 'Bezig…';
      return api('annuleer', { id: ds.bevestig, bericht: $('#ann-bericht').value, mail: $('#ann-mail').checked }).then(function () {
        S.data.afspraken.forEach(function (a) { if (a.id === ds.bevestig) a.status = 'geannuleerd (salon)'; });
        S.cancelOpen = null; renderAfspraken(); toast('Afspraak geannuleerd');
      }).catch(function (err) { fout(err); t.disabled = false; t.textContent = 'Ja, annuleer'; });
    }
    if (t.id === 'wk-vorige') { S.week--; S.addOpen = null; S.kopieerZeker = false; return renderWerktijden(); }
    if (t.id === 'wk-volgende') { S.week++; S.addOpen = null; S.kopieerZeker = false; return renderWerktijden(); }
    if (ds.open) { S.addOpen = ds.open; return renderWerktijden(); }
    if (ds.sluit) { S.addOpen = null; return renderWerktijden(); }
    if (ds.preset) { var p = ds.preset.split('-'); return voegBlokToe(S.addOpen, p[0], p[1]); }
    if (ds.toevoegen) return voegBlokToe(ds.toevoegen, $('#add-van').value, $('#add-tot').value);
    if (ds.weg) {
      var w = ds.weg.split('|'), k = w[0], bl = (S.data.werktijden[k] || []).slice();
      bl.splice(+w[1], 1); zetBlokken(k, bl); renderWerktijden(); bewaarDagen([k]);
      if (S.data.afspraken.some(function (a) { return a.datum === k && a.status === 'bevestigd'; })) toast('Weggehaald. De afspraken op deze dag blijven gewoon staan.');
      return;
    }
    if (t.id === 'kopieer-week') {
      var ma = R.plusDagen(R.maandag(S.data.nu.datum), S.week * 7), keys = [], heeftAl = false;
      for (var i = 0; i < 7; i++) {
        var dk = R.plusDagen(ma, i);
        if (dk < S.data.nu.datum) continue;
        keys.push(dk);
        if ((S.data.werktijden[dk] || []).length) heeftAl = true;
      }
      if (!keys.length) return;
      if (heeftAl && !S.kopieerZeker) { S.kopieerZeker = true; return renderWerktijden(); }
      keys.forEach(function (dk) { zetBlokken(dk, (S.data.werktijden[R.plusDagen(dk, -7)] || []).slice()); });
      S.kopieerZeker = false; renderWerktijden(); return bewaarDagen(keys);
    }
    if (ds.nieuw) {
      S.draft.push({ id: '', soort: ds.nieuw, naam: ds.nieuw === 'extra' ? 'Nieuwe extra' : 'Nieuwe behandeling', omschrijving: '', naam_en: '', omschrijving_en: '', duur: ds.nieuw === 'extra' ? 15 : 60, prijs: '', actief: true });
      S.open = {}; S.open[S.draft.length - 1] = true; S.dirty = true; S.delZeker = null; renderBehandelingen(); renderSavebar();
      var inp = $('#b-naam-' + (S.draft.length - 1)); if (inp) { inp.focus(); inp.select(); }
      return;
    }
    if (ds.verwijder !== undefined) {
      var idx = +ds.verwijder;
      if (S.delZeker !== idx) { S.delZeker = idx; return renderBehandelingen(); }
      S.draft.splice(idx, 1); S.delZeker = null; S.open = {}; S.dirty = true; renderBehandelingen(); return renderSavebar();
    }
    if (t.id === 'ww-knop') {
      var oud = $('#ww-oud').value, nieuw = $('#ww-nieuw').value;
      if (nieuw.length < 6) return toast('Kies een nieuw wachtwoord van minimaal 6 tekens.', true);
      t.disabled = true;
      return api('wachtwoord', { oud: oud, nieuw: nieuw }).then(function () { $('#ww-oud').value = ''; $('#ww-nieuw').value = ''; toast('Wachtwoord gewijzigd'); })
        .catch(fout).then(function () { t.disabled = false; });
    }
    if (t.id === 'uitloggen') { api('uitloggen').catch(function () {}); uitloggenLokaal(); }
  });
  $('#main').addEventListener('input', function (e) {
    if (e.target.dataset.f) wijzigItem(e.target);
    else if (e.target.dataset.s) wijzigInst(e.target);
  });
  $('#main').addEventListener('change', function (e) {
    if (e.target.type === 'checkbox' || e.target.tagName === 'SELECT') {
      if (e.target.dataset.f) wijzigItem(e.target);
      else if (e.target.dataset.s) wijzigInst(e.target);
    }
  });
  $('#main').addEventListener('toggle', function (e) {
    if (e.target.matches && e.target.matches('details.item')) S.open[e.target.dataset.i] = e.target.open;
  }, true);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.data && Date.now() - S.laatst > 60000 && !S.dirty && !S.instDirty) laad();
  });

  if (S.token) {
    $('#app').hidden = false;
    $('#main').innerHTML = '<div class="skeleton" style="height:76px"></div><div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:120px"></div>';
    laad();
  } else toonLogin();
})();
</script>
</body>
</html>
